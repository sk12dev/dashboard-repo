<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Explorer — STEP NetTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="brand" href="index.html"><span class="brand-mark">STEP</span> NetTools</a>
            <nav class="header-nav">
                <a class="nav-link" href="index.html">Tools</a>
                <a class="nav-link" href="devices.html">Devices</a>
                <a class="nav-link" href="alerts.html">Alerts</a>
                <a class="nav-link is-active" href="ports.html">Ports</a>
                <a class="nav-link" href="speedtest.html">Speedtest</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="page-header">
                <h1 class="page-title">Port Explorer</h1>
                <p class="page-subtitle">Inspect interface status, speed, and traffic rates for any monitored device.</p>
            </div>

            <div class="toolbar toolbar--ports">
                <div class="device-picker">
                    <label class="field-label" for="deviceSelect">Device</label>
                    <select id="deviceSelect" class="select-input">
                        <option value="">Select a device…</option>
                    </select>
                </div>
                <div class="search-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input
                        id="portSearch"
                        class="search-input"
                        type="search"
                        placeholder="Search ports…"
                        autocomplete="off"
                        spellcheck="false"
                        disabled
                    >
                </div>
                <span class="stat-pill"><strong id="totalCount">0</strong> ports</span>
                <button type="button" class="stat-pill stat-pill--filter" id="filterUp" data-filter="up" aria-pressed="false" disabled>
                    <span class="status-dot status-dot--up"></span> <strong id="upCount">0</strong> up
                </button>
                <button type="button" class="stat-pill stat-pill--filter" id="filterDown" data-filter="down" aria-pressed="false" disabled>
                    <span class="status-dot status-dot--down"></span> <strong id="downCount">0</strong> down
                </button>
            </div>

            <section class="panel" id="portsPanel">
                <div class="empty-state">Select a device to load its ports.</div>
            </section>
        </main>
    </div>

    <script type="module" src="js/ports.js"></script>
</body>
</html>
