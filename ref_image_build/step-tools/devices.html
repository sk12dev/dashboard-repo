<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Inventory — STEP NetTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="brand" href="index.html">
                <span class="brand-mark">STEP</span>CG
                <span class="brand-sub">NetTools</span>
            </a>
            <nav class="header-nav">
                <a class="nav-link" href="index.html">Tools</a>
                <a class="nav-link is-active" href="devices.html">Devices</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="page-header">
                <h1 class="page-title">Device Inventory</h1>
                <p class="page-subtitle">Live device list from LibreNMS with sortable columns and quick search.</p>
            </div>

            <div class="toolbar">
                <div class="search-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input
                        id="deviceSearch"
                        class="search-input"
                        type="search"
                        placeholder="Search devices…"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                <span class="stat-pill"><strong id="totalCount">0</strong> devices</span>
                <span class="stat-pill"><span class="status-dot status-dot--up"></span> <strong id="upCount">0</strong> up</span>
                <span class="stat-pill"><span class="status-dot status-dot--down"></span> <strong id="downCount">0</strong> down</span>
            </div>

            <section class="panel" id="devicesPanel">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    Loading devices from LibreNMS…
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/devices.js"></script>
</body>
</html>
